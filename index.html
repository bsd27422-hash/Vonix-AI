<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vonix AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #e3e3e3; }
    </style>
</head>
<body class="bg-black text-white h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-[#0b0b0d] border-r border-[#1a1a1e] flex flex-col p-3 shrink-0">
        <button onclick="createNewChat()" class="w-full bg-[#151518] hover:bg-[#1f1f24] border border-[#242429] text-xs font-medium py-2.5 px-4 rounded-full mb-4 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-plus text-[10px]"></i> New chat
        </button>
        <div id="historyList" class="flex-1 overflow-y-auto space-y-1"></div>
        <div class="pt-3 border-t border-[#1a1a1e]">
            <button onclick="openPro()" class="w-full bg-[#141418] hover:bg-[#1c1c22] border border-[#26262e] py-2 px-3 rounded-full text-xs flex items-center justify-between cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-sparkles text-[#a8c7fa]"></i> Upgrade to Pro</span>
                <span class="text-[10px] text-gray-400">15﷼</span>
            </button>
        </div>
    </aside>

    <!-- Main Section -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-14 border-b border-[#1a1a1e] flex items-center px-4 justify-between">
            <button onclick="toggleSidebar()" class="w-9 h-9 rounded-full hover:bg-neutral-800 flex items-center justify-center text-gray-400 cursor-pointer">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <span class="text-sm font-medium">Vonix 2.6</span>
            <div id="userBadge" class="text-xs bg-neutral-900 border border-neutral-800 px-3 py-1 rounded-full text-gray-300">Guest</div>
        </header>

        <!-- Chat Area -->
        <div id="chatScroll" class="flex-1 overflow-y-auto p-4 flex flex-col items-center">
            <div id="welcomeScreen" class="my-auto text-center max-w-lg space-y-3">
                <h1 class="text-3xl font-semibold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Hello, how can I help?</h1>
                <p class="text-xs text-gray-400">Ask Vonix anything, write code, or brainstorm ideas instantly.</p>
            </div>
            <div id="chatMessages" class="w-full max-w-2xl space-y-4 hidden pb-20"></div>
        </div>

        <!-- Input Box -->
        <div class="p-4 bg-black border-t border-[#1a1a1e]">
            <form onsubmit="sendMessage(event)" class="max-w-2xl mx-auto bg-[#131316] border border-[#24242a] rounded-2xl p-3 flex flex-col gap-2">
                <textarea id="userInput" rows="1" placeholder="Ask Vonix..." class="w-full bg-transparent text-sm text-white focus:outline-none resize-none" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage(event);}"></textarea>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-[10px] text-gray-500">No API key required</span>
                    <button type="submit" class="w-8 h-8 rounded-full bg-white text-black hover:bg-gray-200 flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let chats = [];
        let currentChatId = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            chats.unshift({ id: currentChatId, title: 'New chat', messages: [] });
            showWelcome();
        }

        function showWelcome() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('chatMessages').classList.add('hidden');
            document.getElementById('chatMessages').innerHTML = '';
        }

        function showFeed() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('chatMessages').classList.remove('hidden');
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) createNewChat();
            const chat = chats.find(c => c.id === currentChatId);
            if (chat && chat.messages.length === 0) chat.title = text.slice(0, 20);

            showFeed();
            appendMsg(text, 'user');
            chat.messages.push({ sender: 'user', text });
            input.value = '';

            setTimeout(() => {
                let reply = "I'm Vonix, fully ready to assist you!";
                if (text.includes('code') || text.includes('كود')) reply = "Here is your code snippet:\n```html\n<div class='text-white'>Hello Vonix</div>\n```";
                else if (text.includes('idea') || text.includes('أفكار')) reply = "Here are 3 quick SaaS ideas:\n1. AI Assistant tool\n2. Local CRM\n3. Micro-audit engine";
                
                appendMsg(reply, 'assistant');
                chat.messages.push({ sender: 'assistant', text: reply });
            }, 500);
        }

        function appendMsg(text, sender) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm ${sender === 'user' ? 'bg-[#1b1b20] text-white' : 'text-gray-300'}">${text}</div>`;
            container.appendChild(div);
            document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
        }

        function openPro() {
            alert('Vonix Pro ($10 / 15 ريال) - 30 days exact validity.');
        }

        createNewChat();
    </script>
</body>
</html>
