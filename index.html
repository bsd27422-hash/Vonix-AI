<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vonix AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e3e3e3;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e1f20; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #333537; }
        
        .vonix-glow {
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.25));
        }
        .silver-gradient-text {
            background: linear-gradient(90deg, #ffffff 0%, #a8c7fa 50%, #787982 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-[#e3e3e3] h-screen w-screen flex overflow-hidden selection:bg-white/20 selection:text-white">

    <!-- Collapsible Left Sidebar -->
    <aside id="sidebar" class="w-64 bg-[#0b0b0d] border-r border-[#1a1a1e] flex flex-col transition-all duration-300 z-30 shrink-0 h-full">
        <!-- Top Sidebar Controls -->
        <div class="p-3.5 flex items-center justify-between">
            <button onclick="toggleSidebar()" class="w-10 h-10 rounded-full hover:bg-[#1a1a1e] flex items-center justify-center text-[#9ca3af] hover:text-white transition-colors cursor-pointer" title="Collapse menu">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
        </div>

        <!-- New Chat Pill Button -->
        <div class="px-3 mb-4">
            <button onclick="createNewChat()" class="w-full inline-flex items-center justify-center gap-3 bg-[#151518] hover:bg-[#1f1f24] border border-[#242429] text-sm font-medium text-[#e3e3e3] py-2.5 px-4 rounded-full transition-all cursor-pointer">
                <i class="fa-solid fa-plus text-xs text-[#9ca3af]"></i>
                <span>New chat</span>
            </button>
        </div>

        <!-- Recent Chats List -->
        <div class="px-4 mb-2 text-[11px] font-medium text-[#6e6e77] uppercase tracking-wider">Recent</div>
        <div id="chatHistoryList" class="flex-1 overflow-y-auto px-2 space-y-0.5">
            <!-- Populated via JS -->
        </div>

        <!-- Bottom Settings / Pro Trigger -->
        <div class="p-3 border-t border-[#1a1a1e] space-y-1 shrink-0">
            <button onclick="openProModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-full hover:bg-[#151518] text-xs font-medium text-[#c4c7c5] transition-colors cursor-pointer">
                <i class="fa-solid fa-sparkles text-white/80"></i>
                <span>Upgrade to Vonix Pro</span>
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col h-full bg-black relative min-w-0 overflow-hidden">

        <!-- Minimal Top Bar -->
        <header class="h-14 flex items-center justify-between px-4 md:px-6 shrink-0 border-b border-[#1a1a1e]/40">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" id="mobileMenuBtn" class="w-10 h-10 rounded-full hover:bg-[#151518] flex items-center justify-center text-[#9ca3af] hover:text-white transition-colors cursor-pointer">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div class="flex items-center gap-2 text-base font-medium tracking-tight text-white px-3 py-1.5 rounded-xl">
                    <span>Vonix</span>
                    <span class="text-[10px] font-normal text-[#7e7e86] bg-[#141417] border border-[#242429] px-2 py-0.5 rounded-full">2.6</span>
                </div>
            </div>

            <!-- User Avatar -->
            <div class="w-8 h-8 rounded-full bg-[#18181c] border border-[#2c2c32] flex items-center justify-center text-xs font-medium text-white">
                V
            </div>
        </header>

        <!-- Center Stage: Hero Welcome Screen OR Active Chat Feed -->
        <div id="mainScrollArea" class="flex-1 overflow-y-auto px-4 flex flex-col justify-center items-center">
            
            <!-- 1. Centered Main Screen Hero -->
            <div id="welcomeScreen" class="w-full max-w-2xl mx-auto py-6 flex flex-col items-center text-center">
                
                <!-- Vonix Crescent Logo -->
                <div class="mb-4 relative flex flex-col items-center vonix-glow">
                    <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M52 14C30.5 14 14 30.8 14 51.5C14 72.2 30.8 89 51.5 89C68.5 89 82.8 77.7 87.4 62.2C81.8 72.5 70.8 79.5 58.2 79.5C39.8 79.5 25 64.7 25 46.3C25 32.1 33.9 19.9 46.4 15.1C48.2 14.4 50.1 14 52 14Z" fill="url(#crescentGrad)"/>
                        <text x="53" y="59" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="500" font-size="34" letter-spacing="-1">ai</text>
                        <defs>
                            <linearGradient id="crescentGrad" x1="14" y1="14" x2="87" y2="89" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFFFFF"/>
                                <stop offset="0.5" stop-color="#C8CCD4"/>
                                <stop offset="1" stop-color="#757882"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="text-lg font-medium tracking-wide text-white -mt-1">vonix</span>
                </div>

                <!-- Greeting Headline -->
                <h1 class="text-2xl md:text-3xl font-medium tracking-tight mb-2">
                    <span class="silver-gradient-text">Hello, how can I help?</span>
                </h1>
                <p class="text-xs md:text-sm text-[#787880] mb-6">Ask anything, write code, or brainstorm ideas with Vonix.</p>

                <!-- Quick Prompt Suggestion Chips -->
                <div class="flex flex-wrap items-center justify-center gap-2 max-w-xl">
                    <button type="button" onclick="usePrompt('Write clean, modern code for a dark-mode landing page')" class="bg-[#111114] hover:bg-[#1a1a1f] border border-[#222228] text-xs text-[#d1d1d6] px-3.5 py-2 rounded-full transition-all flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-code text-[#8e9196]"></i>
                        <span>Write code</span>
                    </button>
                    <button type="button" onclick="usePrompt('Give me 5 high-revenue SaaS app ideas for 2026')" class="bg-[#111114] hover:bg-[#1a1a1f] border border-[#222228] text-xs text-[#d1d1d6] px-3.5 py-2 rounded-full transition-all flex items-center gap-2 cursor-pointer">
                        <i class="fa-regular fa-lightbulb text-[#8e9196]"></i>
                        <span>Brainstorm ideas</span>
                    </button>
                    <button type="button" onclick="usePrompt('Summarize the key takeaways of a business proposal')" class="bg-[#111114] hover:bg-[#1a1a1f] border border-[#222228] text-xs text-[#d1d1d6] px-3.5 py-2 rounded-full transition-all flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-align-left text-[#8e9196]"></i>
                        <span>Summarize text</span>
                    </button>
                    <button type="button" onclick="usePrompt('Help me draft a professional launch announcement')" class="bg-[#111114] hover:bg-[#1a1a1f] border border-[#222228] text-xs text-[#d1d1d6] px-3.5 py-2 rounded-full transition-all flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-pen-nib text-[#8e9196]"></i>
                        <span>Draft content</span>
                    </button>
                </div>
            </div>

            <!-- 2. Active Conversation Stream -->
            <div id="chatMessages" class="hidden w-full max-w-2xl mx-auto py-6 space-y-4">
                <!-- Messages injected here -->
            </div>

        </div>

        <!-- Bottom Floating Pill Input Container -->
        <div class="w-full bg-black py-3 px-4 shrink-0">
            <div class="max-w-2xl mx-auto">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="bg-[#131316] border border-[#24242a] focus-within:border-[#3e3e48] rounded-[24px] px-4 py-2.5 transition-colors shadow-xl">
                    <textarea id="userInput" rows="1" placeholder="Ask Vonix..." 
                        class="w-full bg-transparent text-sm text-white placeholder-[#787880] focus:outline-none resize-none max-h-32 leading-relaxed"
                        oninput="autoResize(this)"
                        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSendMessage(event); }"></textarea>
                    
                    <!-- Bottom Toolbar inside Input Box -->
                    <div class="flex items-center justify-between mt-1 pt-1">
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="alert('File upload ready')" class="w-8 h-8 rounded-full hover:bg-[#202026] flex items-center justify-center text-[#9ca3af] hover:text-white transition-colors cursor-pointer" title="Add files">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                            <button type="button" class="flex items-center gap-1.5 text-xs text-[#9ca3af] hover:text-white hover:bg-[#202026] px-2.5 py-1 rounded-full transition-colors cursor-pointer">
                                <i class="fa-solid fa-sliders text-[10px]"></i>
                                <span>Tools</span>
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" class="w-8 h-8 rounded-full hover:bg-[#202026] flex items-center justify-center text-[#9ca3af] hover:text-white transition-colors cursor-pointer" title="Voice input">
                                <i class="fa-solid fa-microphone text-xs"></i>
                            </button>
                            <button type="submit" id="sendBtn" class="w-8 h-8 rounded-full bg-white text-black hover:bg-[#e2e2e6] flex items-center justify-center transition-all cursor-pointer">
                                <i class="fa-solid fa-arrow-up text-xs"></i>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center mt-2">
                    <span class="text-[10px] text-[#5e5e66]">Vonix can make mistakes, so double-check it.</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        let chats = JSON.parse(localStorage.getItem('vonix_chats')) || [];
        let currentChatId = null;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        function usePrompt(promptText) {
            const input = document.getElementById('userInput');
            input.value = promptText;
            autoResize(input);
            input.focus();
        }

        function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            chats.unshift({ id: currentChatId, title: 'New chat', messages: [] });
            saveChats();
            renderHistory();
            showWelcomeScreen();
        }

        function showWelcomeScreen() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            const msgBox = document.getElementById('chatMessages');
            msgBox.classList.add('hidden');
            msgBox.innerHTML = '';
        }

        function showChatFeed() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('chatMessages').classList.remove('hidden');
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                chats.unshift({ id: currentChatId, title: text.slice(0, 28), messages: [] });
            }

            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat && currentChat.messages.length === 0) {
                currentChat.title = text.slice(0, 28) + (text.length > 28 ? '...' : '');
            }

            showChatFeed();
            appendMessage(text, 'user');
            if (currentChat) currentChat.messages.push({ sender: 'user', text });
            
            input.value = '';
            input.style.height = 'auto';
            saveChats();
            renderHistory();

            // Simulated AI Response
            setTimeout(() => {
                const reply = "Vonix is online and ready. Type anything or click suggestions to test the interface.";
                appendMessage(reply, 'assistant');
                if (currentChat) {
                    currentChat.messages.push({ sender: 'assistant', text: reply });
                    saveChats();
                }
            }, 500);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const scrollArea = document.getElementById('mainScrollArea');
            const isUser = sender === 'user';

            const row = document.createElement('div');
            row.className = `flex gap-3 items-start ${isUser ? 'justify-end' : ''}`;

            if (isUser) {
                row.innerHTML = `
                    <div class="bg-[#1b1b20] text-[#f3f3f5] px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[80%] text-sm leading-relaxed">
                        ${escapeHTML(text)}
                    </div>
                `;
            } else {
                row.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-[#141418] border border-[#2a2a32] flex items-center justify-center shrink-0 mt-0.5">
                        <span class="text-[10px] font-semibold text-white">ai</span>
                    </div>
                    <div class="text-[#e3e3e3] text-sm leading-relaxed pt-1 max-w-[85%]">
                        ${escapeHTML(text)}
                    </div>
                `;
            }

            container.appendChild(row);
            scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function saveChats() {
            localStorage.setItem('vonix_chats', JSON.stringify(chats));
        }

        function renderHistory() {
            const list = document.getElementById('chatHistoryList');
            if (!list) return;
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                const isActive = chat.id === currentChatId;
                item.className = `px-3 py-1.5 rounded-full text-xs cursor-pointer truncate transition-colors ${isActive ? 'bg-[#1b1b20] text-white font-medium' : 'text-[#9ca3af] hover:bg-[#131316] hover:text-white'}`;
                item.textContent = chat.title;
                item.onclick = () => loadChat(chat.id);
                list.appendChild(item);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            renderHistory();
            if (!chat || chat.messages.length === 0) {
                showWelcomeScreen();
                return;
            }
            showChatFeed();
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            chat.messages.forEach(m => appendMessage(m.text, m.sender));
        }

        function openProModal() {
            alert('Vonix Pro subscription flow ready.');
        }

        // Initialize
        renderHistory();
    </script>
</body>
</html>
